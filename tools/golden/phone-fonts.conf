<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- UI golden: fonts as on the owner's Android phone. Chrome there resolves system-ui, sans-serif, -apple-system, "Segoe UI",
     Arial and Helvetica to Roboto (Android has no other UI font), so every family except monospace maps to Roboto here.
     Used only by tools/golden/ui_golden.js (FONTCONFIG_FILE). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.fonts</dir>
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <test qual="all" name="family" compare="not_eq"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto</string></edit>
  </match>
</fontconfig>
