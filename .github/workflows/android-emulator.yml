# Emulator UI tests (owner, 2026-11-24): the debug APK on an x86_64 API 35 emulator with KVM, set up as the owner's phone
# (1080 x 2340, 420 dpi, dark mode, 3-button navigation), running app/src/androidTest (EmulatorFlowTest: start, Steel, grid,
# orbit / pan / zoom with the label positions, column, Properties -> profile -> Apply, beam, Modify, catalog, End plate 144
# dialog and pick, save / open). Artifacts: screenshots, screen recording, test report, APKs. A short summary goes to the
# ci-results branch (latest/summary.md). Gradle, the NDK, Manifold and the AVD snapshot are cached.
name: Emulator UI tests

on:
  push:
    branches: ['**', '!ci-results']   # every branch but the results branch (each agent runs the full suite on its own branch; concurrency is per branch)
    paths-ignore: ['docs/**', '**.md', 'tests/steel/ui/compare/**']   # documentation-only pushes do not start a run
  workflow_dispatch:

permissions:
  contents: write   # the summary is pushed to the ci-results branch

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  API: 35
  NDK: 30.0.16248370
  CMAKE: 4.1.2

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      # Owner 2026-11-27: the runner's real resources, and the emulator gets as much as the runner allows: cores = min(4, nproc);
      # RAM 8192M on a runner with at least 12 GB, otherwise the most that leaves 3 GB for the host (whole GB, at least 2048M).
      - name: Runner resources
        run: |
          echo "nproc: $(nproc)"; free -g; df -h / | tail -1
          [ -e /dev/kvm ] && echo "/dev/kvm: present" || echo "/dev/kvm: MISSING"
          total_mb=$(free -m | awk '/^Mem:/ {print $2}')
          cores=4; ram=8192   # owner 2026-11-28: the repo is public, the standard runner has 4 vCPU / 16 GB
          [ "$(nproc)" -ge 4 ] && [ "$total_mb" -ge $((12 * 1024)) ] || echo "::warning::runner smaller than 4 vCPU / 12 GB: the emulator still gets 4 cores / 8192M"
          echo "EMU_CORES=$cores" >> "$GITHUB_ENV"; echo "EMU_RAM=${ram}M" >> "$GITHUB_ENV"
          echo "emulator: cores $cores, ram ${ram}M (host RAM ${total_mb} MB), heap 1024M, disk 8G, KVM"

      - uses: actions/checkout@v4

      - name: Data files on main?
        id: data
        run: |
          ok=true
          for f in steel/src/main/assets/steel/profiles.json steel/src/main/assets/steel/tk_catalog.json steel/src/main/assets/steel/tk_ui.json \
                   steel/src/main/assets/steel/thumbs tests/steel/golden/comp/s9_gu.json tests/steel/golden/gen/s9_gen.json tests/steel/golden/s6/bolts.json; do
            [ -e "$f" ] || { echo "missing: $f"; ok=false; }
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "DATA_OK=$ok" >> "$GITHUB_ENV"
          [ -e /dev/kvm ] && echo "KVM=yes" >> "$GITHUB_ENV" || echo "KVM=no" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.data.outputs.ok == 'true'
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        if: steps.data.outputs.ok == 'true'

      - name: Restore NDK, CMake and Manifold
        id: native-cache
        if: steps.data.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.CMAKE }}
            third_party/manifold
          key: native-${{ env.NDK }}-${{ env.CMAKE }}-manifold-v3.5.4

      - name: SDK packages
        if: steps.data.outputs.ok == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK" "cmake;$CMAKE" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/native/*.sh tools/ci/*.sh

      - name: Unit tests with the UI golden (the gate before every APK)
        id: unit
        if: steps.data.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p ci-out
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest -Pabis=x86_64 2>&1 | tee ci-out/unit.log | tail -n 40

      - name: Build the debug APK and the test APK
        id: build
        if: steps.data.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Pabis=x86_64 -PskipUiGolden 2>&1 | tee ci-out/build.log | tail -n 40

      - name: Enable KVM
        if: steps.data.outputs.ok == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the AVD
        if: steps.data.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API }}-x86_64-google_apis-v2-${{ env.EMU_RAM }}-c${{ env.EMU_CORES }}

      - name: Create the AVD snapshot (first run only)
        if: steps.data.outputs.ok == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: ${{ env.EMU_CORES }}
          ram-size: ${{ env.EMU_RAM }}
          heap-size: 1024M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: echo "AVD snapshot created"

      # caches are saved even when a later step fails (actions/cache only saves after a successful job)
      - name: Save the AVD
        if: always() && steps.data.outputs.ok == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API }}-x86_64-google_apis-v2-${{ env.EMU_RAM }}-c${{ env.EMU_CORES }}

      - name: Save NDK, CMake and Manifold
        if: always() && steps.data.outputs.ok == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.CMAKE }}
            third_party/manifold
          key: native-${{ env.NDK }}-${{ env.CMAKE }}-manifold-v3.5.4

      - name: Emulator tests
        id: emu
        if: steps.data.outputs.ok == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: ${{ env.EMU_CORES }}
          ram-size: ${{ env.EMU_RAM }}
          heap-size: 1024M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -accel on -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/ci/emulator_run.sh

      # the APK for the owner's phone (arm64-v8a + x86_64), only when every test passed
      - name: Build the phone APK
        id: phone
        if: steps.data.outputs.ok == 'true' && steps.unit.outcome == 'success' && steps.emu.outcome == 'success'
        run: |
          [ "$(cat ci-out/connected_rc.txt 2>/dev/null)" = 0 ] || { echo "emulator tests failed: no phone APK"; exit 0; }
          ./gradlew --no-daemon assembleDebug -PskipUiGolden 2>&1 | tail -n 20
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p ci-phone && cp app/build/outputs/apk/debug/app-debug.apk "ci-phone/solidsketch-steel-$V-debug.apk"
          unzip -l ci-phone/*.apk | grep -o 'lib/[^/]*/' | sort -u

      - name: Upload the phone APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-phone
          path: ci-phone/*.apk
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: ignore

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording
          path: ci-out/*.mp4
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/testDebugUnitTest/**
            ci-out/*.log
            ci-out/*.txt
          if-no-files-found: ignore

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: ignore

      - name: Summary (and the ci-results branch)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          EMU: ${{ steps.emu.outcome }}
        run: |
          bash tools/ci/publish_results.sh
          # the job fails when anything failed (data missing, unit tests, build, emulator tests)
          [ "$DATA_OK" = true ] || { echo "::error::data files are not on main (owner bundle steel-all-data)"; exit 1; }
          [ "$UNIT" = success ] || { echo "::error::unit tests / UI golden failed"; exit 1; }
          [ "$BUILD" = success ] || { echo "::error::build failed"; exit 1; }
          [ "$(cat ci-out/connected_rc.txt 2>/dev/null)" = 0 ] || { echo "::error::emulator tests failed"; exit 1; }
